module:
  id: "promotion"
  name: "Promotion Module"
  version: "1.0.0"
  description: "Content promotion and maintenance agents for blog growth"

settings:
  # Promotion strategy
  value_ratio: 90  # 90% value, 10% promotion (90/10 rule)

  # Platform defaults
  platforms:
    - reddit
    - youtube
    - twitter
    - linkedin

  # Maintenance settings
  link_check_frequency: "monthly"
  freshness_threshold_days: 365  # Flag content older than this for review

  # Tracking
  track_promotion_history: true
  track_maintenance_history: true
